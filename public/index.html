<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Work-Zilla Notifyer</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>
  <header>
    <h1>Мои задания — Work-Zilla</h1>
    <div class="controls">
      <label>
        Группа заданий:
        <select id="groupSelect"></select>
      </label>
      <button id="reloadBtn">Обновить</button>
      <label class="raw-toggle">
        <input type="checkbox" id="rawToggle" />
        показать сырой JSON
      </label>
    </div>
  </header>

  <main>
    <p id="status"></p>
    <table id="tasksTable" hidden>
      <thead>
        <tr>
          <th>Заказчик</th>
          <th>Задание</th>
          <th>Сумма</th>
          <th>Срок</th>
          <th>Напомнить проверить публикацию</th>
        </tr>
      </thead>
      <tbody id="tasksBody"></tbody>
    </table>
    <pre id="rawJson" hidden></pre>
  </main>

  <script src="app.js"></script>
</body>
</html>
